name: Generate install icons for iPhone, Android and Windows PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-icons.yml'
      - 'app-icon.svg'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize vector app icon
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for size in (180, 192, 512):
              cairosvg.svg2png(url='app-icon.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit install icons to website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Add raster app icons for mobile and desktop installability"
            git push origin HEAD:main
          fi
