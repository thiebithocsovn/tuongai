name: Xuất bản Tường AI lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kiểm tra kiểu xuất bản đang chọn
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      - name: Ghi chú khi Pages xuất bản từ nhánh
        if: steps.kind.outputs.type != 'workflow'
        run: echo "Pages đang xuất bản trực tiếp từ nhánh (${{ steps.kind.outputs.type }}), GitHub tự lo phần này."
      - uses: actions/checkout@v4
        if: steps.kind.outputs.type == 'workflow'
      - uses: actions/configure-pages@v5
        if: steps.kind.outputs.type == 'workflow'
      - uses: actions/upload-pages-artifact@v3
        if: steps.kind.outputs.type == 'workflow'
        with:
          path: .
      - name: Chờ GitHub nhận gói website
        if: steps.kind.outputs.type == 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq 'any(.artifacts[]; .name == "github-pages" and .expired == false)')" = "true" ]; then
              exit 0
            fi
            echo "Gói website chưa sẵn sàng, chờ GitHub đồng bộ (lần $attempt/12)."
            sleep 5
          done
          echo "Không tìm thấy gói github-pages đã tải lên." >&2
          exit 1
      - id: deployment
        if: steps.kind.outputs.type == 'workflow'
        uses: actions/deploy-pages@v4
